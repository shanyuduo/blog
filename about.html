<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 - 深夜技术考古</title>
<meta name="description" content="深夜技术考古是单禹铎的个人技术博客">
<meta name="author" content="单禹铎">
<meta name="keywords" content="opencode,bug,消息ID,回绕,48位,技术排查,AI编程">
<link rel="canonical" href="https://shanyuduo.github.io/blog/">

<style>
  :root {
    --paper: #F6F7F3;
    --ink: #1E2328;
    --ink-soft: #5A6472;
    --ink-faint: #8B93A1;
    --accent: #A84E32;
    --accent-soft: #F3E4DD;
    --rule: #E3E6DE;
    --code-bg: #EEF0EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  /* 阅读进度条 */
  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 50; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px 96px; }

  /* 站点头 */
  header.site {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 20px; margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  header.site a.brand {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
    font-size: 20px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: .5px;
  }
  header.site a.brand:hover { color: var(--accent); }
  header.site .brand-sub {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11px; color: var(--ink-faint); letter-spacing: 2px; text-transform: uppercase;
  }

  /* 文章 */
  article { margin-top: 40px; }

  /* 事故卷宗标签（signature） */
  .case-tag {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12px; letter-spacing: 1px; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: 4px 10px; margin-bottom: 24px;
  }
  .case-meta {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; color: var(--ink-soft); line-height: 2;
    border-left: 3px solid var(--accent);
    padding: 2px 0 2px 16px; margin: 0 0 32px;
  }
  .case-meta .k { color: var(--ink-faint); margin-right: 8px; }

  article h1 {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
    font-size: 34px; line-height: 1.35; font-weight: 600; letter-spacing: .5px;
    margin-bottom: 20px;
  }
  .meta-line { color: var(--ink-faint); font-size: 13.5px; margin-bottom: 44px; }
  .meta-line .sep { margin: 0 10px; color: var(--rule); }

  article p {
    font-size: 17px; line-height: 2.05; margin-bottom: 1.7em; color: var(--ink);
  }
  article p code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.86em; background: var(--code-bg);
    border-radius: 3px; padding: 1px 6px; color: #3A4551;
  }

  /* 首页列表 */
  .post-card {
    display: block; text-decoration: none; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; padding: 28px 28px 24px;
    margin-bottom: 20px; background: #FBFCF9;
    transition: border-color .15s ease, transform .15s ease;
  }
  .post-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .post-card .case-no {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12px; color: var(--accent); letter-spacing: 1px; margin-bottom: 10px;
  }
  .post-card h2 {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
    font-size: 21px; line-height: 1.5; font-weight: 600; margin-bottom: 8px;
  }
  .post-card p.desc { color: var(--ink-soft); font-size: 14.5px; line-height: 1.8; }
  .post-card .post-date { color: var(--ink-faint); font-size: 12.5px; margin-top: 14px; font-family: ui-monospace, "SF Mono", Consolas, monospace; }

  h1.page-title {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
    font-size: 30px; font-weight: 600; letter-spacing: .5px; margin-bottom: 16px;
  }
  .lead { color: var(--ink-soft); font-size: 16px; line-height: 1.9; margin-bottom: 40px; }

  footer.footer {
    margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--rule);
    color: var(--ink-faint); font-size: 13px; line-height: 1.9;
  }
  footer.footer a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--rule); }
  footer.footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 600px) {
    .wrap { padding: 36px 20px 72px; }
    article h1 { font-size: 27px; }
    article p { font-size: 16px; }
    .case-meta { font-size: 11.5px; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="wrap">
<header class="site">
  <a class="brand" href="https://shanyuduo.github.io/blog/">深夜技术考古</a>
  <span class="brand-sub">incident archive</span>
</header>

<article>
<h1 class="page-title">关于本站</h1>
<p>「深夜技术考古」是单禹铎的个人技术博客，记录真实生产事故的排查过程、根因分析与修复方案。</p>

</article>
<footer class="footer">
  本站文章为原创内容，作者：单禹铎（<a href="https://github.com/shanyuduo">GitHub</a>）。
  转载请注明出处。<a href="https://shanyuduo.github.io/blog/about.html">关于本站</a>
</footer>
</div>
<script>
  (function () {
    var p = document.getElementById("progress");
    function onScroll() {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      p.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  })();
</script>
</body>
</html>
